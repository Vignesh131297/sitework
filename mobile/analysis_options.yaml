include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/core/l10n/generated/**
  errors:
    # freezed/json_serializable annotations on constructor parameters.
    invalid_annotation_target: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures

formatter:
  page_width: 120
